# Optional local dependency stack (Redis, MinIO). The database is Cloud Firestore;
# locally use the Firestore emulator (see docs/development.md). Image tags are pinned by digest in Phase 9.
# Credentials below are local-only placeholders; override via a gitignored .env.
name: wallora

services:
  redis:
    image: redis:8
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wallora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infrastructure/.env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["./data/minio:/data"]
