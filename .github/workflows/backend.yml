name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "firebase.json", "infrastructure/firebase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "firebase.json", "infrastructure/firebase/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      IMAGE_PROVIDER: fake
      MODERATION_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Integration tests run against the Firestore emulator (demo-* project, no real data).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g firebase-tools@15.32.1
      - run: firebase emulators:exec --only firestore --project demo-wallora "uv run pytest"
